name: Keepalive

# GitHub disables scheduled workflows in public repositories after 60 days
# without repository activity. Edition runs only push to the `state` branch,
# which is not guaranteed to count as activity, and this project never needs to
# commit to main. Re-enabling the workflows through the REST API once a month
# keeps the schedule alive without creating any commits.
on:
  schedule:
    - cron: '23 14 1 * *'
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for wf in edition.yml keepalive.yml; do
            gh workflow enable "$wf" --repo "$REPO"
            gh api "repos/$REPO/actions/workflows/$wf" --jq '"\(.path): \(.state)"'
          done
